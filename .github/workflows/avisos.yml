# Robot de avisos de mercado: revisa precios y manda notificaciones al iPhone.
# Horarios en UTC (Argentina = UTC−3).
name: Avisos de mercado

on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'  # cada 30 min de 10:00 a 18:30, lunes a viernes (horario de BYMA)
    - cron: '0 11 * * *'           # 8:00 todos los días (recordatorios de compra)
    - cron: '0 */3 * * 0,6'        # fines de semana cada 3 horas (cripto)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tools/notifier --no-audit --no-fund
      - run: node tools/notifier/run.mjs
        env:
          SUPABASE_URL: https://amhgggejivftttyqgglx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: BOpa03HAsR9WPCw_T5NRUYKVPvhbkK7t8pTVUuyR3jgmaOEYhgUU2gVg64v-m2KoO7yGsMczvN0S0tX4UV1EYKY
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://suarezvalen.github.io/finanzas-tino/
