# Robot de avisos de mercado: revisa precios y manda notificaciones al iPhone.
# Horarios en UTC (Argentina = UTC−3).
name: Avisos de mercado

on:
  schedule:
    # A los :07 y :37 (no en punto: GitHub se demora más a esa hora), de 10:07 a 18:37 hora argentina, lunes a viernes.
    # Así llegan el aviso de apertura (10:30) y los de "falta 1 hora" para el cierre de bonos (17:00) y acciones (18:00).
    - cron: '7,37 13-21 * * 1-5'
    - cron: '0 11 * * *'           # 8:00 todos los días (recordatorios de compra)
    - cron: '0 */3 * * 0,6'        # fines de semana cada 3 horas (cripto)
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Mandar una notificación de prueba a tus dispositivos'
        type: boolean
        default: false
      registrar:
        description: 'Registrar los avisos pendientes como enviados, sin mandarlos'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tools/notifier --no-audit --no-fund
      - run: node tools/notifier/run.mjs
        env:
          SUPABASE_URL: https://amhgggejivftttyqgglx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: BOpa03HAsR9WPCw_T5NRUYKVPvhbkK7t8pTVUuyR3jgmaOEYhgUU2gVg64v-m2KoO7yGsMczvN0S0tX4UV1EYKY
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://suarezvalen.github.io/finanzas-tino/
          TEST_PUSH: ${{ inputs.prueba && '1' || '' }}
          MARK_ONLY: ${{ inputs.registrar && '1' || '' }}
